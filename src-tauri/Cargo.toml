[package]
name = "misc-uploader"
version = "0.1.0"
edition = "2021"
description = "misc repo uploader — drag & drop into your WebDAV repo"

[lib]
name = "misc_uploader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"

[profile.release]
strip = true
lto = true
